# =========================================================
# 正式環境（Render）。Dockerfile 設定 SPRING_PROFILES_ACTIVE=prod 啟用，
# 這裡的設定會蓋掉 application.properties 的同名設定。
# 密碼、token 一律從環境變數讀，這個檔案沒有任何秘密，可以放進 Git。
# 在 Render → Environment 要設定的環境變數：
#   DB_URL、DB_USERNAME、DB_PASSWORD   Aiven MySQL
#   REDIS_URL                          Render Key Value 的 Internal URL
#   EZSTOCK_JWT_PRIVATE_KEY            JWT 私鑰（一定要設，不然每次重開所有人都會被登出）
#   FINMIND_TOKEN                      FinMind token
#   GOOGLE_CLIENT_ID                   Google 登入（不設就不顯示 Google 按鈕）
#   EZSTOCK_LINE_CHANNEL_SECRET、EZSTOCK_LINE_CHANNEL_TOKEN、LINE_BOT_ID   LINE Bot（不設就不啟用）
#   IMPORT_ON_STARTUP                  第一次部署設 true 匯入股票資料，匯完改回 false
# =========================================================

# Render 會用 PORT 環境變數告訴程式要聽哪個 port
server.port=${PORT:8080}
# 前面有 Render / Vercel 的反向代理：從 X-Forwarded-For、X-Forwarded-Proto 取得使用者真正的 IP 與 https
# （登入失敗次數限制靠 IP，不設的話所有人的 IP 都會變成代理伺服器的 IP）
server.forward-headers-strategy=framework
# 作品集網站流量很小，執行緒從預設 200 降到 20，省記憶體
server.tomcat.threads.max=20

# ---------- MySQL（Aiven）----------
# Aiven 一定要 SSL，DB_URL 範例：jdbc:mysql://xxx.aivencloud.com:12345/defaultdb?sslMode=REQUIRED&serverTimezone=Asia/Taipei
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Aiven 免費方案的連線數有限，連線池從預設 10 降到 5
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# ---------- JPA：縮短啟動時間 ----------
# Render 免費方案只有 0.1 顆 CPU，完整啟動要 90 秒以上，離 Render 的部署逾時太近。
# 資料表結構由 Flyway 管理，CI 測試時已經用 validate 檢查過 Entity 跟資料表對得上，
# 正式環境不用每次啟動再檢查一次（validate 要讀所有資料表的結構，很花時間）
spring.jpa.hibernate.ddl-auto=none
# 不在啟動時連資料庫查版本和功能，直接指定 MySQL 方言
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ---------- Redis（Upstash）----------
# REDIS_URL 範例：rediss://default:密碼@xxx.upstash.io:6379
spring.data.redis.url=${REDIS_URL}
# Upstash 只接受 TLS 加密連線，沒加密的連線在握手時就會被斷線（Connection closed prematurely）。
# 不靠網址開頭是 redis:// 還是 rediss:// 判斷，直接強制開 TLS
spring.data.redis.ssl.enabled=true

# ---------- 會員 ----------
# 正式環境是 https，refresh token 的 cookie 只走 https
ezstock.jwt.cookie-secure=true
ezstock.google.client-id=${GOOGLE_CLIENT_ID:}

# ---------- LINE、FinMind、匯入 ----------
ezstock.line.bot-id=${LINE_BOT_ID:}
finmind.api.token=${FINMIND_TOKEN:}
ezstock.import.run-on-startup=${IMPORT_ON_STARTUP:false}

# ---------- Log ----------
# 容器的檔案重開就消失，log 只印到畫面（Render 的 Logs 頁看得到），不寫檔案
logging.file.name=
logging.level.com.ezstock=INFO
logging.level.org.hibernate.SQL=WARN

# ---------- 健康檢查 ----------
# 只開放 /actuator/health，給 Render 健康檢查和 cron-job.org 定時喚醒用；不顯示細節，避免洩漏系統資訊
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
